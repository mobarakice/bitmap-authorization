# APISIX standalone configuration
# This is used when APISIX_STAND_ALONE=true
apisix:
  node_listen: 9080
  enable_admin: true
  admin_listen:
    ip: 0.0.0.0
    port: 9180

nginx_config:
  http:
    custom_lua_shared_dict:
      perm_cache: 10m

deployment:
  role: data_plane
  role_data_plane:
    config_provider: yaml

extra_lua_path: "/usr/local/apisix/apisix/plugins/?.lua"

plugins:
  - bitmap-auth
  - limit-count

routes:
  # ---- Public routes (bypass auth) ----
  - uri: /api/auth/login
    upstream:
      type: roundrobin
      nodes:
        "host.docker.internal:8080": 1
    plugins:
      limit-count:
        count: 10
        time_window: 60
        key_type: var
        key: remote_addr
        rejected_code: 429
        rejected_msg: "Too many login attempts. Try again later."

  # ---- Protected routes ----
  - uri: /api/*
    upstream:
      type: roundrobin
      nodes:
        "host.docker.internal:8080": 1
    plugins:
      bitmap-auth:
        redis_host: "auth-redis"
        redis_port: 6379
        jwt_secret: "$ENV://JWT_SECRET"
        chunk_size: 1024
        perm_cache_ttl: 60
        bypass_paths:
          - "/api/auth/login"
          - "/api/auth/logout"

#END
